services:
  ollama:
    image: ollama/ollama:latest      # https://hub.docker.com/r/ollama/ollama/tags?name=latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: 2
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Model warm-up: pulls models on first start
  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
      
    command:
      - sh
      - -c
      - |
        echo 'Pulling qwen3.5:0.8b...'
        curl -sf -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{"name":"qwen3.5:0.8b","stream":false}' --max-time 600
        echo 'Pulling nomic-embed-text...'
        curl -sf -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{"name":"nomic-embed-text","stream":false}' --max-time 300
        echo 'Models ready.'
    restart: on-failure

volumes:
  ollama-models: