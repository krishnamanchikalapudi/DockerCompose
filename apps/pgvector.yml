services:
  # ── PostgreSQL + pgvector: http://localhost:5432 ────────────
  postgresql:
    image: pgvector/pgvector:pg18       # https://hub.docker.com/r/pgvector/pgvector/tags
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_MULTIPLE_DATABASES: petclinic,mlflow
    volumes:
      - ./pgvector.sql:/docker-entrypoint-initdb.d/postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data: {}
